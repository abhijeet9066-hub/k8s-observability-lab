apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-demo-api
  namespace: observability-demo
  labels:
    app: observability-demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: observability-demo-api
  template:
    metadata:
      labels:
        app: observability-demo-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/abhijeet9066-hub/k8s-observability-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OTEL_SERVICE_NAME
              value: observability-demo-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: observability-demo-api
  namespace: observability-demo
  labels:
    app: observability-demo-api
spec:
  selector:
    app: observability-demo-api
  ports:
    - name: http
      port: 8000
      targetPort: http
